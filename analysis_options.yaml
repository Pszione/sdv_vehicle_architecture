# Shared rules for the pure Dart packages (vss_gen, vehicle_domain,
# vehicle_profiles, zonal_system). Flutter packages use flutter_lints.
include: package:lints/recommended.yaml

formatter:
  page_width: 120

analyzer:
  exclude:
    - "**/*.g.dart"
  language:
    strict-casts: true
    strict-raw-types: true

linter:
  rules:
    - avoid_print
    - prefer_const_constructors
    - prefer_final_locals
    - always_declare_return_types
    - unawaited_futures
