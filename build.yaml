targets:
  $default:
    builders:
      your_app_name|vss_builder:
        enabled: true

builders:
  vss_builder:
    import: 'package:your_app_name/tool/vss_generator.dart'
    builder_factories: ['vssTreeBuilder']
    build_extensions: { '.json': ['.vss.g.dart'] }
    auto_apply: dependents
    build_to: source