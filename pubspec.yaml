name: sdv_vehicle_architecture
description: Software-Defined Vehicle monorepo (HMI apps + domain and zonal simulation packages).
publish_to: none

environment:
  sdk: ^3.10.7

workspace:
  - packages/vss_gen
  - packages/vehicle_domain
  - packages/vehicle_profiles
  - packages/zonal_system
  - packages/vehicle_ui_kit
  - apps/infotainment
  - apps/digital_cluster

dev_dependencies:
  melos: ^8.10.0
  lints: ^6.1.0

melos:
  scripts:
    generate:
      description: Runs build_runner (Riverpod + VSS) in topological order.
      exec:
        command: dart run build_runner build
        concurrency: 1
        orderDependents: true
      packageFilters:
        dependsOn: build_runner
    analyze:
      description: Analyzes every package.
      exec:
        command: dart analyze --fatal-infos .
        concurrency: 1
    test:dart:
      description: Tests of the pure Dart packages.
      exec:
        command: dart test
        concurrency: 1
      packageFilters:
        flutter: false
        dirExists: test
    test:flutter:
      description: Tests of the Flutter packages and apps.
      exec:
        command: flutter test
        concurrency: 1
      packageFilters:
        flutter: true
        dirExists: test
